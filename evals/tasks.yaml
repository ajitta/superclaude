  # only — the user's /sc:X or a workflow step that names it." A project
  # command whose body names an /sc: command is that workflow step: the model
  # must reach it through the Skill tool (a typed /sc:X at the start of the
  # prompt is expanded by the harness and is not a Skill call). The look-alike
  # pair checks the other half: a plain request that only resembles an
  # on-request command must not start it. sc:git was disable-model-invocation
  # before 4.27.0, so its delegated probe could not pass then.
