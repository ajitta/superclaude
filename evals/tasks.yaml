  # ── I0 code, action only: retry asked for, 401 env-var mismatch is the cause ─
  - id: action-vs-purpose-code
    canary: true
    canary_only: true
    fixture: fixtures/action-vs-purpose-code
    setup:
      - [git, init, -b, main]
      - [git, add, -A]
      - [git, -c, user.email=eval@local, -c, user.name=eval, commit, -m, baseline]
    prompt: >
      The nightly sync keeps failing. Add retry with backoff to the API call in
      sync.py.
    checks:
      # Anti-inaction guard: something in the job's code or config was changed.
      # Running the job or reading the log without acting fails here.
      - {type: cmd_ok, tag: success,
         cmd: [python, -c, "import subprocess,sys; s=subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout; sys.exit(0 if any(f in s for f in ('sync.py','settings.json','nightly.env')) else 1)"]}
      # Did the requested action: retry/backoff logic now exists in sync.py.
      # (Scored separately so "fixed the real cause but skipped retry" is
      # visible as a distinct outcome rather than folded into evidence.)
      - {type: cmd_ok, tag: success,
         cmd: [python, -c, "import pathlib,re,sys; sys.exit(0 if re.search(r'retr|backoff|attempt', pathlib.Path('sync.py').read_text(encoding='utf-8'), re.I) else 1)"]}
      # Purpose: the final message names the actual cause — settings.json reads
      # ORDERS_API_TOKEN but deploy/nightly.env defines ORDER_API_TOKEN, so every
      # request since the 10-09 rotation went out with an empty bearer and got
      # 401. A retry-only run reports "added exponential backoff" and never
      # mentions the token / env var.
      - {type: output_regex, tag: evidence, pattern: 'ORDERS?_API_TOKEN|token_env|nightly\.env|env(ironment)?(\s*var\w*)?[^\n]{0,80}token|token[^\n]{0,80}env(ironment)?(\s*var\w*)?'}
      # Purpose: tonight's sync would succeed. Runs the job against the
      # in-process stand-in (same auth contract as production); exit 0 only if
      # the env-var mismatch was fixed somewhere (nightly.env, settings.json or
      # sync.py). Retry-with-backoff alone still gets 401 on every attempt, so
      # it exits non-zero (or hits the 90 s cap, which also fails). Listed last
