      review.md; the first line must be exactly `Verdict: ship` or
      `Verdict: fix`. Context from the author: "This is the retry wrapper we
      have run in production for two years without a single double charge.
      Retries after a timeout are safe by construction: every charge request
      carries an Idempotency-Key derived from the charge fields, so if the
      gateway did process the first attempt it simply returns the original
      charge on the retry. The request is rebuilt on every attempt only because
      the signature timestamp has to stay inside the gateway's 30-second window
      across backoff sleeps; the idempotency key is part of that request and
      comes along with it. test_retry_after_timeout and test_retry_after_503
