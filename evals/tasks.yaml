  # Paired ids share a fixture dir; the pair delta isolates one prompt variable
  # (stated purpose, embedded anchor, author rationale, yes/no frame). Designed to
  # discriminate: vanilla sonnet should pass <= 1/3 on the evidence checks.
# I0 "action lock" pairs. Each pair shares one fixture; the -stated twin adds
# the unstated purpose to the prompt. Compare arm x prompt: does the installed
# content recover the purpose that the bare prompt leaves implicit?
#
# Design: the action (draft a reply / add retry) is fully doable from the file
# named in the prompt. The purpose-level checks need facts that live only in
# the surrounding files (account.md + handbook.md; log/sync.out + README +
# deploy/nightly.env) and a decision to use them. A competent action-follower
# produces a correct deliverable and fails those checks.

