apiVersion: batch/v1
kind: CronJob
metadata:
  name: events-export
spec:
  schedule: "40 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: export
              image: registry.local/orders/ops-tools:2026.09
              command: ["python", "backup/events_export.py"]
