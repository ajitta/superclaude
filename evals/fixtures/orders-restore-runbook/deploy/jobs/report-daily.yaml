apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-daily
spec:
  schedule: "0 6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.local/orders/reports:2026.10
              command: ["python", "-m", "reports.daily"]
