apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: registry.local/shop/search:8.15
          ports:
            - containerPort: 9200
          envFrom:
            - configMapRef:
                name: search-env
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
