apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: registry.local/api/worker:2026.10.12
          env:
            - name: QUEUE_URL
              value: amqp://queue:5672/api
