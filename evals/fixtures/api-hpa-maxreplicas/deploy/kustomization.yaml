apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api
resources:
  - api/configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - db-proxy/deployment.yaml
  - db-proxy/service.yaml
  - worker/deployment.yaml
configMapGenerator:
  - name: db-proxy-config
    files:
      - db-proxy/pgbouncer.ini
