name: Tests

# No push trigger: master is not a release channel (stable, the default branch,
# is). `make release` runs this through `make ci` before it moves stable.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # SHA-pinned: astral-sh/setup-uv publishes no major-version tags past v7
      # (`@v10` does not resolve), and its README pins the full commit. Cache is
      # off because `uv pip install --system` does not read uv.lock.
      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip list --system

      - name: Verify package installation
        run: |
          python -c "import superclaude; print(f'superclaude {superclaude.__version__} installed')"

      - name: Run tests
        # -v --tb=short come from pyproject addopts; only color is CI-specific.
        run: |
          pytest --color=yes

  checks:
    name: Lint, plugin and doctor checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # SHA-pinned: astral-sh/setup-uv publishes no major-version tags past v7
      # (`@v10` does not resolve), and its README pins the full commit. Cache is
      # off because `uv pip install --system` does not read uv.lock.
      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run ruff linter
        run: |
          ruff check src/ tests/

      - name: Check ruff formatting
        run: |
          ruff format --check src/ tests/

      - name: Run mypy
        # Same check as `make typecheck`; src/ is clean, so any error fails.
        run: |
          mypy src

      - name: Check plugin report header
        # The plugin ships markers and a report header, not fixtures (the
        # pm_agent fixtures went with b8cd144). Only the plugin prints the
        # header, so it proves the plugin itself loaded.
        run: |
          pytest --collect-only -q -p no:cacheprovider | grep -q "^superclaude: "

      - name: Install to user scope
        run: |
          superclaude install --scope user --force

      - name: Run doctor command
        run: |
          superclaude doctor --verbose --scope user
