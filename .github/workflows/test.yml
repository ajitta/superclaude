name: Tests

# No push trigger: master is not a release channel (stable, the default branch,
# is). `make release` runs this through `make ci` before it moves stable.
on:
  pull_request:
    branches: [master]
    # Serena session memories: no test reads them
    paths-ignore: ['.serena/**']
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip list --system

      - name: Verify package installation
        run: |
          python -c "import superclaude; print(f'SuperClaude {superclaude.__version__} installed')"

      - name: Run tests
        run: |
          pytest -v --tb=short --color=yes

      # tests/unit/scripts is excluded from the default run via pyproject addopts
      # --ignore (it triggers a Windows-only native abort under memory pressure).
      # Run it here in a separate pytest process so Linux CI keeps covering it.
      # `-o addopts=` clears the inherited --ignore.
      - name: Run scripts tests (isolated)
        run: |
          pytest tests/unit/scripts -o addopts= -v --tb=short --color=yes

  checks:
    name: Lint, plugin and doctor checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run ruff linter
        run: |
          ruff check src/ tests/

      - name: Check ruff formatting
        run: |
          ruff format --check src/ tests/

      - name: Check plugin report header
        # The plugin ships markers and a report header, not fixtures (the
        # pm_agent fixtures went with b8cd144). Only the plugin prints the
        # header, so it proves the plugin itself loaded.
        run: |
          pytest --collect-only -q -p no:cacheprovider | grep -q "^SuperClaude: "

      - name: Install to user scope
        run: |
          superclaude install --scope user --force

      - name: Run doctor command
        run: |
          superclaude doctor --verbose --scope user
